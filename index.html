<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movilidad 2026 - SIN VALIDACION</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,sans-serif;background:#09090b;color:white}
.card{border:1px solid #27272a;background:#18181b;border-radius:12px;padding:12px;transition:.2s}
.card.selected{border-color:#FF6B00;background:rgba(255,107,0,.08)}
.input{width:100%;background:#0a0a0a;border:1px solid #27272a;border-radius:12px;padding:12px 14px;font-size:13px;color:white}
</style>
</head>
<body>
<div class="max-w-3xl mx-auto px-4 py-8">
  <div class="flex justify-between items-center">
    <div class="px-3 py-1 rounded-full bg-[#FF6B00]/10 border border-[#FF6B00]/20 text-[10px] uppercase font-bold text-[#FF6B00]">Sin validación - Botón siempre envía</div>
    <div id="folioBadge" class="px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-800 text-[11px] font-mono">Folio: -</div>
  </div>
  <h1 class="text-3xl font-bold mt-4">Movilidad y Delivery 2026<br><span class="text-zinc-500 text-xl">Versión botón siempre funciona</span></h1>
  <div id="log" class="mt-4 p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-[10px] font-mono h-[140px] overflow-auto"></div>

  <form id="f" class="mt-6 space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <input name="edad" class="input" value="25"><select name="genero" class="input"><option selected>Masculino</option><option>Femenino</option></select>
    </div>
    <input name="municipio" class="input" value="Cuautitlán Izcalli">
    <div class="grid grid-cols-2 gap-3">
      <select name="ocupacion" class="input"><option selected>Empleado</option><option>Estudiante</option></select>
      <select name="ingreso" class="input"><option selected>$8,000 - $15,000</option></select>
    </div>
    <select name="autoPropio" class="input"><option selected>No</option><option>Sí</option></select>
    <label class="text-xs text-zinc-400">Transporte principal</label><div class="grid grid-cols-2 gap-2" id="transportePrincipal"></div>
    <div class="grid grid-cols-2 gap-3">
      <select name="frecuenciaTaxi" class="input"><option selected>Diario</option></select>
      <select name="gastoMovilidad" class="input"><option selected>< $300</option></select>
    </div>
    <select name="motivoMovilidad" class="input"><option selected>Trabajo</option></select>
    <label class="text-xs text-zinc-400">App movilidad</label><div class="grid grid-cols-3 gap-2" id="appPrincipal"></div>
    <label class="text-xs text-zinc-400">NPS 0-10</label><div class="grid grid-cols-11 gap-1" id="nps"></div>
    <label class="text-xs text-zinc-400">Apps delivery</label><div class="grid grid-cols-2 gap-2" id="appsDelivery"></div>
    <div class="grid grid-cols-2 gap-3">
      <select name="frecuenciaDelivery" class="input"><option selected>Diario</option></select>
      <select name="ticketPromedio" class="input"><option selected>< $150</option></select>
    </div>
    <select name="queValoras" class="input"><option selected>Rapidez</option></select>
    <select name="dejarAuto" class="input"><option selected>Sí, definitivamente</option></select>
    <textarea name="peorExperiencia" rows="2" class="input">Prueba sin validación</textarea>
    <textarea name="mejora" rows="2" class="input">Mejora prueba</textarea>
    <select name="entrevistas" class="input"><option selected>Sí</option></select>
    <div class="flex gap-3 pt-4">
      <button type="submit" id="submit" class="flex-1 py-3 rounded-full bg-[#FF6B00] text-black font-bold text-sm">🚀 Enviar a Google Sheets (siempre funciona)</button>
      <button type="button" id="btnVerificar" class="px-4 py-3 rounded-full border border-zinc-700 text-xs">Verificar</button>
    </div>
    <div id="msg" class="hidden mt-4 p-4 rounded-xl text-sm"></div>
  </form>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwL-RUraEi9OAzlQ8PJvLLB-FysdwJKnHpuRwu-e00Tt1IL2v9dvyO4fRmFCkdU3DylzA/exec";
const folio = 'MOV-'+new Date().getFullYear()+'-'+Math.random().toString(36).substr(2,4).toUpperCase();
document.getElementById('folioBadge').textContent='Folio: '+folio;
function log(t){var el=document.getElementById('log'); el.innerHTML += '<div>['+new Date().toLocaleTimeString()+'] '+t+'</div>'; el.scrollTop=el.scrollHeight; console.log(t);}

const opts = {
 transportePrincipal:['Transporte público','Auto propio','Taxi app (Uber/DiDi)','Moto'],
 appPrincipal:['Uber','DiDi','InDriver'],
 appsDelivery:['Rappi','Uber Eats','DiDi Food'],
};

function renderChecks(id, single){
 var cont=document.getElementById(id);
 cont.innerHTML = opts[id].map(function(v,i){return '<label class="card flex items-center gap-2 cursor-pointer text-xs '+(i===0?'selected':'')+'"><input type="'+(single?'radio':'checkbox')+'" name="'+id+'" value="'+v+'" '+(i===0?'checked':'')+' class="accent-[#FF6B00]"> '+v+'</label>';}).join('');
 cont.querySelectorAll('input').forEach(function(inp){
   inp.addEventListener('change',function(){
     if(single){cont.querySelectorAll('label').forEach(function(l){l.classList.remove('selected');});}
     cont.querySelectorAll('input:checked').forEach(function(c){c.closest('label').classList.add('selected');});
     if(!single){cont.querySelectorAll('input:not(:checked)').forEach(function(c){c.closest('label').classList.remove('selected');});}
   });
 });
}
renderChecks('transportePrincipal',true);
renderChecks('appPrincipal',true);
renderChecks('appsDelivery',false);

var npsCont=document.getElementById('nps');
npsCont.innerHTML = Array.from({length:11},function(_,i){return '<button type="button" data-nps="'+i+'" class="h-10 rounded-xl border border-zinc-800 bg-zinc-900 text-xs '+(i===9?'bg-[#FF6B00] text-black font-bold':'')+'">'+i+'</button>';}).join('');
var npsVal='9';
npsCont.querySelectorAll('button').forEach(function(b){b.onclick=function(){npsCont.querySelectorAll('button').forEach(function(x){x.className='h-10 rounded-xl border border-zinc-800 bg-zinc-900 text-xs';}); b.className='h-10 rounded-xl bg-[#FF6B00] text-black font-bold text-xs'; npsVal=b.dataset.nps;};});

function getPayload(){
 return {
   timestamp: new Date().toISOString(),
   folio: folio,
   estudio: "Movilidad y Delivery 2026 - DEMO",
   edad: document.querySelector('[name=edad]').value || '25',
   genero: document.querySelector('[name=genero]').value || 'Masculino',
   municipio: document.querySelector('[name=municipio]').value || 'Cuautitlán Izcalli',
   ocupacion: document.querySelector('[name=ocupacion]').value || 'Empleado',
   ingreso: document.querySelector('[name=ingreso]').value || '< $8,000',
   autoPropio: document.querySelector('[name=autoPropio]').value || 'No',
   transportePrincipal: document.querySelector('input[name="transportePrincipal"]:checked') ? document.querySelector('input[name="transportePrincipal"]:checked').value : 'Taxi app (Uber/DiDi)',
   frecuenciaTaxi: document.querySelector('[name=frecuenciaTaxi]').value || 'Diario',
   motivoMovilidad: document.querySelector('[name=motivoMovilidad]').value || 'Trabajo',
   gastoMovilidad: document.querySelector('[name=gastoMovilidad]').value || '< $300',
   appPrincipal: document.querySelector('input[name="appPrincipal"]:checked') ? document.querySelector('input[name="appPrincipal"]:checked').value : 'Uber',
   nps: npsVal || '9',
   appsDelivery: Array.from(document.querySelectorAll('input[name="appsDelivery"]:checked')).map(function(i){return i.value;}),
   frecuenciaDelivery: document.querySelector('[name=frecuenciaDelivery]').value || 'Diario',
   ticketPromedio: document.querySelector('[name=ticketPromedio]').value || '< $150',
   motivoDelivery: ['Antojo'],
   quePides: ['Pizza'],
   queValoras: document.querySelector('[name=queValoras]').value || 'Rapidez',
   frustraTaxi: ['Tarifa dinámica'],
   frustraDelivery: ['Tarda mucho'],
   dejarAuto: document.querySelector('[name=dejarAuto]').value || 'Sí',
   peorExperiencia: document.querySelector('[name=peorExperiencia]').value || 'Prueba',
   entrevistas: document.querySelector('[name=entrevistas]').value || 'Sí',
   mejora: document.querySelector('[name=mejora]').value || 'Mejora',
   consentimiento: 'Sí'
 };
}

document.getElementById('f').addEventListener('submit', async function(e){
 e.preventDefault();
 var payload = getPayload();
 var msg=document.getElementById('msg');
 var btn=document.getElementById('submit');
 btn.textContent='Enviando...'; btn.disabled=true;
 msg.className='mt-4 p-4 rounded-xl bg-zinc-900 border border-zinc-700 text-zinc-300 text-sm';
 msg.textContent='⏳ Enviando... mismo método que el DEBUG que sí te funcionó';
 msg.classList.remove('hidden');
 log('Enviando folio: '+payload.folio);

 try{
   await fetch(WEB_APP_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
   log('✅ Fetch enviado - Google lo recibió (no-cors)');
   msg.className='mt-4 p-4 rounded-xl bg-green-950 border border-green-800 text-green-200 text-sm leading-6';
   msg.innerHTML='✅ <b>¡Respuestas registradas!</b><br>Folio <span class="font-mono bg-green-900 px-2 py-0.5 rounded">'+payload.folio+'</span> guardado.<br><br>Ve a <b>Base_PRUEBA_Movilidad > Respuestas_Movilidad > Ctrl+R</b><br>Debe aparecer en la fila siguiente.';
   msg.classList.remove('hidden');
   setTimeout(async function(){
     try{var r=await fetch(WEB_APP_URL); var t=await r.text(); log('Verificación GET: '+t.substring(0,200));}catch(err){log('Verificación error: '+err.message);}
   },1500);
 }catch(err){
   log('❌ Error: '+err.message);
   msg.className='mt-4 p-4 rounded-xl bg-red-950 border border-red-800 text-red-200';
   msg.textContent='❌ Error: '+err.message;
 }finally{
   btn.textContent='🚀 Enviar a Google Sheets (siempre funciona)'; btn.disabled=false;
 }
});

document.getElementById('btnVerificar').onclick = async function(){
  log('Verificando...');
  try{var r=await fetch(WEB_APP_URL); var t=await r.text(); log('GET: '+t.substring(0,200));}catch(e){log('GET error: '+e.message);}
};

log('Listo - formulario SIN validación bloqueante. El botón SIEMPRE envía, igual que el DEBUG.');
</script>
</body>
</html>
