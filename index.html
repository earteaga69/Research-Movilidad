<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>DEBUG ENVIO</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white p-6 font-mono text-xs">
<h1 class="text-lg font-bold mb-4">DEBUG - Prueba directa a tu Web App</h1>
<p class="text-zinc-500 mb-4">URL: https://script.google.com/macros/s/AKfycbwL-RUraEi9OAzlQ8PJvLLB-FysdwJKnHpuRwu-e00Tt1IL2v9dvyO4fRmFCkdU3DylzA/exec</p>
<div id="log" class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 h-[300px] overflow-auto"></div>
<button id="b1" class="mt-4 px-6 py-3 bg-[#FF6B00] text-black rounded-full font-bold">1️⃣ Enviar payload MÍNIMO (debe llegar SI o SI)</button>
<button id="b2" class="mt-4 ml-2 px-6 py-3 bg-white text-black rounded-full font-bold">2️⃣ Enviar payload COMPLETO con todas las preguntas</button>
<div id="msg" class="hidden mt-4 p-4 rounded-xl"></div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwL-RUraEi9OAzlQ8PJvLLB-FysdwJKnHpuRwu-e00Tt1IL2v9dvyO4fRmFCkdU3DylzA/exec";
function log(t){document.getElementById('log').innerHTML += '<div>['+new Date().toLocaleTimeString()+'] '+t+'</div>'; console.log(t);}

async function enviar(payload, nombre){
  const msg=document.getElementById('msg');
  msg.className='mt-4 p-4 rounded-xl bg-zinc-900 border'; msg.textContent='⏳ Enviando '+nombre+'...'; msg.classList.remove('hidden');
  log('Enviando '+nombre+' folio:'+payload.folio);
  try{
    await fetch(WEB_APP_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
    log('✅ Fetch no-cors enviado - si no hubo error de red, Google lo recibió');
    msg.className='mt-4 p-4 rounded-xl bg-green-950 border border-green-800 text-green-200';
    msg.innerHTML='✅ '+nombre+' enviado (no-cors).<br>Folio: '+payload.folio+'<br><br>Ahora ve a tu Sheet Base_PRUEBA_Movilidad > Respuestas_Movilidad > Ctrl+R<br>Si no aparece, ve a Apps Script > Ejecuciones (icono reloj) y busca el último doPost - ahí dice el error exacto.';
    // Verificar filas
    setTimeout(async ()=>{
      try{const r=await fetch(WEB_APP_URL); const j=await r.json(); log('Verificación GET: filas totales = '+j.rows);}catch(e){log('GET verificación falló: '+e.message);}
    },2000);
  }catch(e){
    log('❌ ERROR fetch: '+e.message);
    msg.className='mt-4 p-4 rounded-xl bg-red-950 border border-red-800 text-red-200';
    msg.textContent='❌ Error: '+e.message;
  }
}

document.getElementById('b1').onclick=()=>{
  const payload={"timestamp":new Date().toISOString(),"folio":"TEST-MIN-"+Math.random().toString(36).substr(2,4).toUpperCase(),"estudio":"Movilidad y Delivery 2026 - DEMO","edad":"25","genero":"Masculino","municipio":"Cuautitlán Izcalli","ocupacion":"Empleado","ingreso":"$8,000 - $15,000","autoPropio":"No","transportePrincipal":"Taxi app (Uber/DiDi)","frecuenciaTaxi":"Diario","motivoMovilidad":"Trabajo","gastoMovilidad":"< $300","appPrincipal":"Uber","nps":"9","appsDelivery":["Rappi"],"frecuenciaDelivery":"Diario","ticketPromedio":"< $150","motivoDelivery":["Antojo"],"quePides":["Pizza"],"queValoras":"Rapidez","frustraTaxi":["Tarifa dinámica"],"frustraDelivery":["Tarda mucho"],"dejarAuto":"Sí","peorExperiencia":"Prueba mínima","entrevistas":"Sí","mejora":"Prueba mínima mejora","consentimiento":"Sí"};
  enviar(payload, "PAYLOAD MÍNIMO");
};

document.getElementById('b2').onclick=()=>{
  const payload={"timestamp":new Date().toISOString(),"folio":"TEST-FULL-"+Math.random().toString(36).substr(2,4).toUpperCase(),"estudio":"Movilidad y Delivery 2026 - DEMO","edad":"28","genero":"Femenino","municipio":"Cuautitlán Izcalli Centro","ocupacion":"Estudiante","ingreso":"> $25,000","autoPropio":"Sí","transportePrincipal":"Transporte público","frecuenciaTaxi":"3-4 veces","motivoMovilidad":"Seguridad","gastoMovilidad":"$300-$800","appPrincipal":"DiDi","nps":"8","appsDelivery":["Rappi","Uber Eats"],"frecuenciaDelivery":"3-4 veces","ticketPromedio":"$150-$300","motivoDelivery":["No quiero cocinar","Antojo"],"quePides":["Tacos / Comida mexicana","Pizza / Hamburguesas"],"queValoras":"Precio / Promos","frustraTaxi":["Tarda en llegar","Cancela viaje"],"frustraDelivery":["Llega frío"],"dejarAuto":"Quizá","peorExperiencia":"El conductor canceló a mitad del camino y me cobró","entrevistas":"Depende del pago","mejora":"Que haya más cobertura en Izcalli y que no suban tanto la tarifa de noche","consentimiento":"Sí"};
  enviar(payload, "PAYLOAD COMPLETO");
};

log('Listo. Dale al botón 1 primero. Si ese llega, tu Web App está bien.');
</script>
</body></html>
