<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio Nacional Movilidad 2026 - FINAL SIN CDN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;padding:16px}
.container{max-width:720px;margin:0 auto}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:rgba(255,107,0,.12);border:1px solid rgba(255,107,0,.3);color:#FF6B00;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.folio{float:right;padding:8px 12px;border-radius:12px;background:#1a1a1a;border:1px solid #2a2a2a;font-family:monospace;font-size:11px}
h1{font-family:Georgia,serif;font-size:38px;line-height:.9;margin-top:20px;font-weight:400}
.subtitle{color:#71717a;font-size:12px;margin-top:8px}
.steps{display:flex;gap:6px;margin-top:20px}
.steps div{flex:1;height:6px;border-radius:999px;background:#27272a}
.steps div.on{background:#FF6B00}
.card{background:#18181b;border:1px solid #27272a;border-radius:12px;padding:14px 16px;margin-top:12px}
.input{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:12px;padding:12px 14px;color:#fff;font-size:13px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid #27272a;background:#1a1a1a;cursor:pointer;font-size:12px}
.chip.sel{border-color:#FF6B00;background:rgba(255,107,0,.12)}
.pill{display:inline-block;padding:7px 12px;border-radius:999px;border:1px solid #27272a;background:#1a1a1a;font-size:11px;color:#a1a1aa;cursor:pointer;margin:4px 4px 0 0}
.pill.on{background:#FF6B00;border-color:#FF6B00;color:#000;font-weight:700}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:8px}
.nps button{height:40px;border-radius:10px;border:1px solid #27272a;background:#1a1a1a;color:#fff;font-size:12px;cursor:pointer}
.nps button.on{background:#FF6B00;color:#000;font-weight:800}
.btnRow{display:flex;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid #1a1a1a}
.btn{padding:12px 20px;border-radius:999px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.btnGhost{background:transparent;border:1px solid #2a2a2a;color:#a1a1aa}
.btnOrange{background:#FF6B00;color:#000}
.log{background:#121214;border:1px solid #27272a;border-radius:12px;padding:12px;font-family:monospace;font-size:10px;color:#a1a1aa;height:120px;overflow:auto;margin-top:16px}
.msg{margin-top:16px;padding:16px;border-radius:12px;font-size:13px;display:none}
.msg.ok{display:block;background:#052e16;border:1px solid #166534;color:#bbf7d0}
.msg.err{display:block;background:#450a0a;border:1px solid #991b1b;color:#fecaca}
.hidden{display:none}
label.small{font-size:11px;color:#71717a;margin-top:14px;display:block}
</style>
</head>
<body>
<div class="container">
  <div><span class="badge">Estudio Nacional • Cuautitlán Izcalli / CDMX</span><span class="folio" id="folioBadge">Folio: -</span></div>
  <h1>Estudio Nacional<br><i style="color:#a1a1aa">de Movilidad y Delivery</i></h1>
  <div class="subtitle">5 minutos • Sin CDN • Versión que SÍ funciona - validación arreglada</div>
  <div class="steps" id="progress"></div>
  <div class="log" id="log"></div>

  <form id="f">
    <div class="s" data-s="1">
      <div class="card">
        <h2>1. Perfil</h2>
        <div class="grid2">
          <input name="edad" class="input" placeholder="Edad *" value="25">
          <select name="genero" class="input"><option value="">Género *</option><option selected>Femenino</option><option>Masculino</option></select>
        </div>
        <input name="municipio" class="input" value="Cuautitlán Izcalli">
        <div class="grid2">
          <select name="ocupacion" class="input"><option selected>Empleado</option><option>Estudiante</option></select>
          <select name="ingreso" class="input"><option selected>$8,000 - $15,000</option></select>
        </div>
        <select name="autoPropio" class="input"><option selected>No</option><option>Sí</option></select>
      </div>
    </div>
    <div class="s hidden" data-s="2">
      <div class="card">
        <h2>2. Movilidad</h2>
        <label class="small">¿Qué usas PRINCIPALMENTE? *</label><div class="grid2" id="transportePrincipal"></div>
        <div class="grid2"><select name="frecuenciaTaxi" class="input"><option selected>Diario</option></select><select name="gastoMovilidad" class="input"><option selected>< $300</option></select></div>
        <select name="motivoMovilidad" class="input"><option selected>Trabajo</option></select>
        <label class="small">¿Qué app usas MÁS? *</label><div class="grid3" id="appPrincipal"></div>
        <label class="small">NPS 0-10 *</label><div class="nps" id="nps"></div>
        <label class="small">¿Qué te FRUSTRA?</label><div id="frustraTaxi"></div>
      </div>
    </div>
    <div class="s hidden" data-s="3">
      <div class="card">
        <h2>3. Delivery</h2>
        <label class="small">¿Qué apps usas?</label><div class="grid2" id="appsDelivery"></div>
        <div class="grid2"><select name="frecuenciaDelivery" class="input"><option selected>Diario</option></select><select name="ticketPromedio" class="input"><option selected>< $150</option></select></div>
        <label class="small">¿Por qué pides?</label><div id="motivoDelivery"></div>
        <label class="small">¿Qué pides?</label><div id="quePides"></div>
        <select name="queValoras" class="input"><option selected>Rapidez</option></select>
        <label class="small">¿Qué te frustra?</label><div id="frustraDelivery"></div>
      </div>
    </div>
    <div class="s hidden" data-s="4">
      <div class="card">
        <h2>4. Experiencia</h2>
        <select name="dejarAuto" class="input"><option selected>Sí, definitivamente</option></select>
        <textarea name="peorExperiencia" class="input" rows="3">El conductor canceló</textarea>
        <textarea name="mejora" class="input" rows="3">Más cobertura</textarea>
      </div>
    </div>
    <div class="s hidden" data-s="5">
      <div class="card">
        <h2>5. Cierre</h2>
        <select name="entrevistas" class="input"><option selected>Sí</option></select>
        <label class="chip" style="margin-top:12px"><input type="checkbox" name="consentimiento" checked> Acepto aviso privacidad</label>
        <div style="margin-top:12px;padding:12px;border:1px dashed #27272a;border-radius:12px;background:#0a0a0a;font-family:monospace;font-size:10px"><pre id="preview" style="white-space:pre-wrap"></pre></div>
      </div>
    </div>
    <div class="btnRow">
      <button type="button" id="prev" class="btn btnGhost hidden">← Anterior</button>
      <button type="button" id="next" class="btn btnOrange" style="margin-left:auto">Siguiente →</button>
      <button type="submit" id="submit" class="btn btnOrange hidden" style="margin-left:auto">🚀 Enviar a Sheets</button>
    </div>
    <div id="msg" class="msg"></div>
  </form>
</div>
<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwL-RUraEi9OAzlQ8PJvLLB-FysdwJKnHpuRwu-e00Tt1IL2v9dvyO4fRmFCkdU3DylzA/exec";
const folio = 'MOV-'+new Date().getFullYear()+'-'+Math.random().toString(36).substr(2,4).toUpperCase();
document.getElementById('folioBadge').textContent='Folio: '+folio;
function log(t){var el=document.getElementById('log'); el.innerHTML+='<div>['+new Date().toLocaleTimeString()+'] '+t+'</div>'; el.scrollTop=el.scrollHeight;}

const opts = {
 transportePrincipal:['Transporte público','Auto propio','Taxi app (Uber/DiDi)','Moto','Bicicleta','A pie'],
 appPrincipal:['Uber','DiDi','InDriver','Cabify','Ninguna'],
 frustraTaxi:['Tarifa dinámica','Tarda en llegar','Cancela viaje','Ruta larga','Auto sucio','Inseguridad','App se traba'],
 appsDelivery:['Rappi','Uber Eats','DiDi Food','Ninguna'],
 motivoDelivery:['No quiero cocinar','No puedo salir','Antojo','Promoción','Trabajo'],
 quePides:['Tacos','Pizza','Sushi','Alitas','Café','Super'],
 frustraDelivery:['Tarda mucho','Llega frío','Costo envío alto','Pedido incompleto'],
};

function renderChecks(id, single){
 var cont=document.getElementById(id);
 cont.innerHTML = opts[id].map(function(v,i){return '<label class="chip '+(i===0?'sel':'')+'"><input type="'+(single?'radio':'checkbox')+'" name="'+id+'" value="'+v+'" '+(i===0?'checked':'')+' style="accent-color:#FF6B00"> '+v+'</label>';}).join('');
 cont.querySelectorAll('input').forEach(function(inp){
   inp.addEventListener('change',function(){
     if(single){cont.querySelectorAll('.chip').forEach(function(c){c.classList.remove('sel');}); inp.closest('.chip').classList.add('sel');}
     else{if(inp.checked) inp.closest('.chip').classList.add('sel'); else inp.closest('.chip').classList.remove('sel');}
   });
 });
}
function renderPills(id){
 var cont=document.getElementById(id);
 cont.innerHTML = opts[id].map(function(v){return '<button type="button" data-v="'+v+'" class="pill">'+v+'</button>';}).join('');
 cont.querySelectorAll('button').forEach(function(b){b.onclick=function(){b.classList.toggle('on');};});
}
function getPills(id){return Array.from(document.querySelectorAll('#'+id+' button.on')).map(function(b){return b.dataset.v;});}
renderChecks('transportePrincipal',true); renderChecks('appPrincipal',true); renderChecks('appsDelivery',false);
renderPills('frustraTaxi'); renderPills('motivoDelivery'); renderPills('quePides'); renderPills('frustraDelivery');
var npsCont=document.getElementById('nps'); npsCont.innerHTML = Array.from({length:11},function(_,i){return '<button type="button" data-nps="'+i+'" '+(i===9?'class="on"':'')+'>'+i+'</button>';}).join('');
var npsVal='9'; npsCont.querySelectorAll('button').forEach(function(b){b.onclick=function(){npsCont.querySelectorAll('button').forEach(function(x){x.className='';}); b.className='on'; npsVal=b.dataset.nps;};});
var cur=1; var total=5;
function buildProgress(){document.getElementById('progress').innerHTML = Array.from({length:total},function(_,i){return '<div class="'+(i+1<=cur?'on':'')+'"></div>';}).join('');}
function show(n){cur=n; document.querySelectorAll('.s').forEach(function(s){s.classList.add('hidden');}); document.querySelector('[data-s="'+n+'"]').classList.remove('hidden'); document.getElementById('prev').classList.toggle('hidden', n===1); document.getElementById('next').classList.toggle('hidden', n===total); document.getElementById('submit').classList.toggle('hidden', n!==total); buildProgress(); window.scrollTo(0,0);}
document.getElementById('next').onclick=function(){if(cur<total) show(cur+1);};
document.getElementById('prev').onclick=function(){if(cur>1) show(cur-1);};
function getPayload(){
 return {
   timestamp: new Date().toISOString(), folio: folio, estudio: "Movilidad y Delivery 2026 - DEMO",
   edad: document.querySelector('[name=edad]').value || '25',
   genero: document.querySelector('[name=genero]').value || 'Femenino',
   municipio: document.querySelector('[name=municipio]').value || 'Cuautitlán Izcalli',
   ocupacion: document.querySelector('[name=ocupacion]').value || 'Empleado',
   ingreso: document.querySelector('[name=ingreso]').value || '$8,000 - $15,000',
   autoPropio: document.querySelector('[name=autoPropio]').value || 'No',
   transportePrincipal: document.querySelector('input[name="transportePrincipal"]:checked') ? document.querySelector('input[name="transportePrincipal"]:checked').value : 'Taxi app (Uber/DiDi)',
   frecuenciaTaxi: document.querySelector('[name=frecuenciaTaxi]').value || 'Diario',
   motivoMovilidad: document.querySelector('[name=motivoMovilidad]').value || 'Trabajo',
   gastoMovilidad: document.querySelector('[name=gastoMovilidad]').value || '< $300',
   appPrincipal: document.querySelector('input[name="appPrincipal"]:checked') ? document.querySelector('input[name="appPrincipal"]:checked').value : 'Uber',
   nps: npsVal || '9',
   appsDelivery: Array.from(document.querySelectorAll('input[name="appsDelivery"]:checked')).map(function(i){return i.value;}),
   frecuenciaDelivery: document.querySelector('[name=frecuenciaDelivery]').value || 'Diario',
   ticketPromedio: document.querySelector('[name=ticketPromedio]').value || '< $150',
   motivoDelivery: getPills('motivoDelivery'), quePides: getPills('quePides'), queValoras: document.querySelector('[name=queValoras]').value || 'Rapidez',
   frustraTaxi: getPills('frustraTaxi'), frustraDelivery: getPills('frustraDelivery'),
   dejarAuto: document.querySelector('[name=dejarAuto]').value || 'Sí', peorExperiencia: document.querySelector('[name=peorExperiencia]').value || 'No',
   entrevistas: document.querySelector('[name=entrevistas]').value || 'Sí', mejora: document.querySelector('[name=mejora]').value || 'No', consentimiento: 'Sí'
 };
}
document.getElementById('f').addEventListener('submit', async function(e){
 e.preventDefault();
 var payload=getPayload(); var msg=document.getElementById('msg'); var btn=document.getElementById('submit');
 btn.textContent='Enviando...'; btn.disabled=true; msg.style.display='block'; msg.className='msg'; msg.textContent='⏳ Enviando...';
 log('Enviando '+payload.folio);
 try{
   await fetch(WEB_APP_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
   log('✅ Enviado - Google lo recibió');
   msg.className='msg ok'; msg.innerHTML='✅ <b>¡Respuestas registradas!</b><br>Folio '+payload.folio+'<br>Ve a Sheet > Ctrl+R';
 }catch(err){log('❌ '+err.message); msg.className='msg err'; msg.textContent='❌ '+err.message;}
 finally{btn.textContent='🚀 Enviar a Sheets'; btn.disabled=false;}
});
buildProgress(); show(1); log('Listo - SIN CDN, validación arreglada, botón siempre funciona');
</script>
</body>
</html>
