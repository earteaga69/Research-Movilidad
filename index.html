<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio Nacional de Movilidad y Delivery 2026 - FIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#09090b;color:white;font-family:Inter} .input{width:100%;background:#0a0a0a;border:1px solid #27272a;border-radius:12px;padding:12px 14px;font-size:13px;color:white} .card.selected{border-color:#FF6B00;background:rgba(255,107,0,.08)}</style>
</head>
<body class="max-w-3xl mx-auto p-4">
<h1 class="text-2xl font-bold mt-6">Estudio Movilidad - PRUEBA FIX</h1>
<p class="text-xs text-zinc-500 mt-2">Folio: <span id="folio"></span> | WebApp: https://script.google.com/macros/s/AKfycbwL-RUraEi9OAzlQ8PJv...</p>
<div id="diag" class="mt-4 p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-[11px] font-mono"></div>

<form id="f" class="mt-6 space-y-3">
<input name="edad" required placeholder="Edad *" class="input">
<input name="municipio" required placeholder="Municipio *" value="Cuautitlán Izcalli" class="input">
<select name="transportePrincipal" required class="input"><option value="">Transporte *</option><option>Transporte público</option><option>Auto propio</option><option selected>Taxi app (Uber/DiDi)</option></select>
<select name="appPrincipal" required class="input"><option value="">App movilidad *</option><option selected>Uber</option><option>DiDi</option></select>
<select name="queValoras" required class="input"><option value="">Que valoras *</option><option selected>Rapidez</option><option>Precio</option></select>
<textarea name="peorExperiencia" required placeholder="Peor experiencia *" class="input">Prueba test fix</textarea>
<textarea name="mejora" required placeholder="Mejora *" class="input">Mejora test</textarea>
<label class="flex gap-2 text-xs"><input type="checkbox" name="consentimiento" required checked> Acepto aviso</label>

<div class="flex gap-2 pt-4">
<button type="submit" id="btn" class="px-6 py-3 rounded-full bg-[#FF6B00] text-black font-bold">Enviar a Google Sheets</button>
<button type="button" id="testBtn" class="px-4 py-3 rounded-full border border-zinc-700 text-xs">Probar conexión</button>
</div>
<div id="msg" class="hidden mt-4 p-4 rounded-xl text-sm"></div>
</form>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwL-RUraEi9OAzlQ8PJvLLB-FysdwJKnHpuRwu-e00Tt1IL2v9dvyO4fRmFCkdU3DylzA/exec";
const folio = 'MOV-'+new Date().getFullYear()+'-'+Math.random().toString(36).substr(2,4).toUpperCase();
document.getElementById('folio').textContent = folio;

function logDiag(t){document.getElementById('diag').innerHTML += '<div>'+new Date().toLocaleTimeString()+': '+t+'</div>'; console.log(t);}

async function probarConexion(){
 logDiag('Probando GET a WebApp...');
 try{
   const r = await fetch(WEB_APP_URL, {method:'GET'});
   const txt = await r.text();
   logDiag('GET OK: '+txt.substring(0,200));
   return true;
 }catch(e){logDiag('GET ERROR: '+e.message+' - Revisa que el deployment sea Cualquier persona'); return false;}
}

document.getElementById('testBtn').onclick = probarConexion;

document.getElementById('f').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const btn = document.getElementById('btn');
 const msg = document.getElementById('msg');
 btn.textContent='Enviando...'; btn.disabled=true;
 msg.className='mt-4 p-4 rounded-xl text-sm bg-zinc-900 border border-zinc-700 text-zinc-300'; msg.textContent='⏳ Enviando a Google Sheets...'; msg.classList.remove('hidden');
 
 const payload = {
   timestamp: new Date().toISOString(),
   folio: folio,
   estudio: "Movilidad y Delivery 2026 - DEMO",
   edad: document.querySelector('[name=edad]').value,
   genero: "Prueba",
   municipio: document.querySelector('[name=municipio]').value,
   ocupacion: "Prueba",
   ingreso: "< $8,000",
   autoPropio: "No",
   transportePrincipal: document.querySelector('[name=transportePrincipal]').value,
   frecuenciaTaxi: "Diario",
   motivoMovilidad: "Trabajo",
   gastoMovilidad: "< $300",
   appPrincipal: document.querySelector('[name=appPrincipal]').value,
   nps: "9",
   appsDelivery: ["Rappi"],
   frecuenciaDelivery: "Diario",
   ticketPromedio: "< $150",
   motivoDelivery: ["Antojo"],
   quePides: ["Pizza"],
   queValoras: document.querySelector('[name=queValoras]').value,
   frustraTaxi: ["Tarifa dinámica"],
   frustraDelivery: ["Tarda mucho"],
   dejarAuto: "Sí, definitivamente",
   peorExperiencia: document.querySelector('[name=peorExperiencia]').value,
   entrevistas: "Sí",
   mejora: document.querySelector('[name=mejora]').value,
   consentimiento: "Sí"
 };

 logDiag('Payload folio: '+payload.folio);
 
 try{
   // Fix text/plain para evitar CORS preflight
   await fetch(WEB_APP_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
   logDiag('Fetch POST enviado (no-cors, no se puede leer respuesta)');
   // Como no-cors no permite leer respuesta, asumimos éxito si no lanzó error de red
   // El verdadero check es en Ejecuciones de Apps Script
   msg.className='mt-4 p-4 rounded-xl text-sm bg-green-950 border border-green-800 text-green-200';
   msg.innerHTML = '✅ ¡Respuestas enviadas! Folio: <b>'+folio+'</b><br><br>Ahora ve a tu Sheet <b>Base_PRUEBA_Movilidad</b> > pestaña <b>Respuestas_Movilidad</b> y presiona <b>Ctrl+R</b> para refrescar. Debe aparecer en la fila 2.<br><br>Si no aparece, ve a Apps Script > <b>Ejecuciones</b> (reloj a la izquierda) y revisa el último doPost. Si dice "No postData" es porque el deployment no está en Cualquier persona.';
   msg.classList.remove('hidden');
   // Intentamos también verificar con GET cuántas filas hay
   setTimeout(async ()=>{
     try{
       const r = await fetch(WEB_APP_URL);
       const j = await r.json();
       logDiag('Verificación GET después de envío: filas='+j.rows);
       if(j.rows>1){msg.innerHTML += '<br><br>✔️ Verificado: Sheet tiene '+j.rows+' filas';}
     }catch{}
   }, 2000);
 }catch(err){
   logDiag('POST ERROR: '+err.message);
   msg.className='mt-4 p-4 rounded-xl text-sm bg-red-950 border border-red-800 text-red-200';
   msg.textContent='❌ Error de red: '+err.message+' - Verifica que tu Web App esté desplegada como Cualquier persona y que sea la última versión.';
   msg.classList.remove('hidden');
 }finally{
   btn.textContent='Enviar a Google Sheets'; btn.disabled=false;
 }
});
logDiag('Formulario cargado. Listo para probar.');
</script>
</body>
</html>
